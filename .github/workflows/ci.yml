name: CI java
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        name: Build e Testes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout de codigo
              uses: actions/checkout@v4

            - name: Configurar Java
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
            
            - name: Compilar aplicacao
              run: javac -d bin src/App.java

            - name: Executar aplicacao
              run: java -cp bin App